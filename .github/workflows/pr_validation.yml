# Performs checks on the codebase (formatting, tests, ..)

name: PR validation

on:
  pull_request:
    branches: [main]

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check Black style
        uses: psf/black@354c61aad99ee26eb7794d91f92d837afefa0f25
        with:
          options: "--check --diff"
          version: "~=25.1.0"

      - name: Install uv
        uses: astral-sh/setup-uv@696e4e1bf2f38a7ac027afc72ca9d963427412ae
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install build dependencies
        run: uv sync --all-extras

      - name: Run the tests
        run: uv run pytest